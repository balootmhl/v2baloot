# v2baloot — sourced from ~/.config/hypr/hyprland.conf:
#   source = /usr/share/v2baloot/hyprland.conf

# Server picker (Walker) and quick toggle
bindd = SUPER ALT, V, v2baloot servers, exec, v2baloot menu
bindd = SUPER ALT SHIFT, V, v2baloot connect/disconnect, exec, v2baloot toggle

# Want the window floating? Window-rule syntax differs between Hyprland versions, so add a rule
# for your version in your own config. The app ids are:
#   org.omarchy.v2baloot       (GTK window)
#   org.omarchy.v2baloot.tui   (terminal UI opened from Waybar/tray)
