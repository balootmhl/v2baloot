[package]
name = "v2baloot-gui"
description = "GTK4/libadwaita front-end for v2baloot"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "v2baloot-gui"
path = "src/main.rs"

[dependencies]
v2baloot-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
async-channel = "2"
toml.workspace = true
