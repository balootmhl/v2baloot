[workspace]
resolver = "2"
members = ["crates/core", "crates/v2baloot", "crates/gui"]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2021"
license = "MIT"
authors = ["Moe Hein Latt <baloot.mhl@gmail.com>"]
repository = "https://github.com/balootmhl/v2baloot"

[workspace.dependencies]
v2baloot-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
url = "2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Build speed over the last few percent of runtime speed: v2baloot spends its time waiting on the
# network and Xray, and LTO + a single codegen unit made `makepkg` take ~10 minutes on a laptop.
lto = false
codegen-units = 16
strip = true
