name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't paste share links, subscription URLs or server addresses — they contain credentials."
  - type: input
    id: version
    attributes:
      label: v2baloot version
      description: "`v2baloot --version`"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Proxy, TUN, Not connected]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Omarchy version (or distro), Hyprland version, `xray version`
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`v2baloot logs`, `journalctl --user -u v2baloot -n 50`, and for TUN `journalctl -u 'v2baloot-tun@*' -n 50` (remove anything private)"
      render: text
